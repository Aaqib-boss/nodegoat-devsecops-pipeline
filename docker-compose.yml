services:
  mongo:
    image: mongo:6
    container_name: nodegoat-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    networks:
      - nodegoat-net

  web:
    build: .
    container_name: nodegoat-web
    depends_on:
      - mongo
    environment:
      - MONGODB_URI=mongodb://mongo:27017/nodegoat
      - SESSION_SECRET=${SESSION_SECRET}
      - ZAP_API_KEY=${ZAP_API_KEY}
      - CRYPTO_KEY=${CRYPTO_KEY}
      - NODE_ENV=development
      - PORT=4000
    ports:
      - "4000:4000"
    networks:
      - nodegoat-net

networks:
  nodegoat-net:
    driver: bridge

volumes:
  mongo-data:
